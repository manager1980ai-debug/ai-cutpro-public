name: Build AI CutPro prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/AICutPro.App/AICutPro.App.csproj
      - run: dotnet build src/AICutPro.App/AICutPro.App.csproj --configuration Release --no-restore
      - run: dotnet run --project tests/AICutPro.Core.Checks/AICutPro.Core.Checks.csproj --configuration Release
        env:
          AI_CUTPRO_CI_DXF_DIR: external-dxf-fixtures
      - name: Install independent DXF parser
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install 'ezdxf>=1.3,<2' 'shapely>=2,<3'
      - name: Independently audit DXF entities, radii and perimeters
        if: matrix.os == 'ubuntu-latest'
        run: python tests/external_dxf_check.py external-dxf-fixtures
      - name: Independently audit DXF with explicit nondefault tolerance policy
        if: matrix.os == 'ubuntu-latest'
        run: python tests/external_dxf_check.py external-dxf-fixtures --join-mm 0.00002 --intersection-mm 0.0000002 --containment-mm 0.00002
      - name: Independently cross-check DXF nesting and net area in GEOS/Shapely
        if: matrix.os == 'ubuntu-latest'
        run: python tests/external_geos_check.py external-dxf-fixtures
      - name: Independently inspect licensed external DXF corpus
        if: matrix.os == 'ubuntu-latest'
        run: python tests/external_corpus_audit.py
      - name: Publish Windows preview (self-contained, no machine control)
        if: matrix.os == 'windows-latest'
        run: dotnet publish src/AICutPro.App/AICutPro.App.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/AI-CutPro-Windows-Preview -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
      - name: Install Windows GUI smoke dependencies
        if: matrix.os == 'windows-latest'
        run: python -m pip install pywinauto Pillow
      - name: Probe actual AI CutPro window and capture screenshot
        if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: python tests/windows_gui_smoke.py dist/AI-CutPro-Windows-Preview/AICutPro.App.exe dist/gui-smoke.png
      - name: Upload GUI smoke screenshot if available
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: AI-CutPro-GUI-Smoke
          path: dist/gui-smoke.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows preview executable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: AI-CutPro-Windows-Preview
          path: dist/AI-CutPro-Windows-Preview/
          if-no-files-found: error
          retention-days: 14
